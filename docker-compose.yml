version: '1.0'

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - '9092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - bash -ec "echo > /dev/tcp/localhost/9092"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 300s

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8081:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    image: node:22-alpine
    working_dir: /app
    command: >-
      sh -c 'if [ ! -f node_modules/.deps-lock ] && node -e
      "Object.keys(require(\"./package.json\").dependencies).forEach((d) =>
      require(d))" >/dev/null 2>&1; then touch node_modules/.deps-lock; fi;
      if [ ! -f node_modules/.deps-lock ] || [ package.json -nt
      node_modules/.deps-lock ] || [ package-lock.json -nt
      node_modules/.deps-lock ]; then npm ci && touch
      node_modules/.deps-lock; fi; npm start'
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '7001:7001'
    environment:
      PORT: 7001
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./user-service:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s = require('node:net').connect(7001, '127.0.0.1'); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 300s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.users.rule=PathPrefix(`/api/v1/users`)'
      - 'traefik.http.routers.users.entrypoints=web'
      - 'traefik.http.services.users.loadbalancer.server.port=7001'

  post-service:
    image: node:22-alpine
    working_dir: /app
    command: >-
      sh -c 'if [ ! -f node_modules/.deps-lock ] && node -e
      "Object.keys(require(\"./package.json\").dependencies).forEach((d) =>
      require(d))" >/dev/null 2>&1; then touch node_modules/.deps-lock; fi;
      if [ ! -f node_modules/.deps-lock ] || [ package.json -nt
      node_modules/.deps-lock ] || [ package-lock.json -nt
      node_modules/.deps-lock ]; then npm ci && touch
      node_modules/.deps-lock; fi; npm start'
    restart: unless-stopped
    env_file:
      - ./post-service/.env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - '7000:7000'
    environment:
      PORT_POST_SERVICE: 7000
      WEB_CONCURRENCY: 1
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
    volumes:
      - ./post-service:/app
      - /app/node_modules
      - post_images:/app/uploads-images
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s = require('node:net').connect(7000, '127.0.0.1'); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 300s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.posts.rule=PathPrefix(`/api/v1/posts`)'
      - 'traefik.http.routers.posts.entrypoints=web'
      - 'traefik.http.services.posts.loadbalancer.server.port=7000'

  auth-service:
    image: node:22-alpine
    working_dir: /app
    command: >-
      sh -c 'if [ ! -f node_modules/.deps-lock ] && node -e
      "Object.keys(require(\"./package.json\").dependencies).forEach((d) =>
      require(d))" >/dev/null 2>&1; then touch node_modules/.deps-lock; fi;
      if [ ! -f node_modules/.deps-lock ] || [ package.json -nt
      node_modules/.deps-lock ] || [ package-lock.json -nt
      node_modules/.deps-lock ]; then npm ci && touch
      node_modules/.deps-lock; fi; npm start'
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - '7002:7002'
    environment:
      PORT: 7002
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s = require('node:net').connect(7002, '127.0.0.1'); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 180s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`)'
      - 'traefik.http.routers.auth.entrypoints=web'
      - 'traefik.http.services.auth.loadbalancer.server.port=7002'
  traefik:
    image: traefik:latest
    restart: unless-stopped
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  post_images:
  kafka_data:
