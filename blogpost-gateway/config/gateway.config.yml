http:
  port: 8080
admin:
  port: 9876
  host: localhost
apiEndpoints:
  api:
    host: '*'
    paths: '/ip'
  users:
    host: '*'
    methods: 'GET, POST, PUT, DELETE'
    paths: '/api/v1/users*'
  posts:
    host: '*'
    methods: 'GET, POST, PUT, DELETE'
    paths: '/api/v1/posts*'
  auth:
    host: '*'
    methods: 'POST'
    paths: '/api/v1/auth*'
serviceEndpoints:
  httpbin:
    url: 'https://httpbin.org'
  postService:
    url: 'http://post-service:7000'
  userService:
    url: 'http://user-service:7001'
  authService:
    url: 'http://auth-service:7002'
policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - rate-limit
pipelines:
  default:
    apiEndpoints:
      - api
    policies:
      # Uncomment `key-auth:` when instructed to in the Getting Started guide.
      # - key-auth:
      - rate-limit:
          - action:
              max: 20
              windowMs: 120000
              rateLimitBy: '${req.ip}'
      - proxy:
          - action:
              serviceEndpoint: httpbin
              changeOrigin: true

  users:
    apiEndpoints:
      - users
    policies:
      # Uncomment `key-auth:` when instructed to in the Getting Started guide.
      # - key-auth:
      - rate-limit:
          - action:
              max: 20
              windowMs: 120000
              rateLimitBy: '${req.ip}'
      - proxy:
          - action:
              serviceEndpoint: userService
              changeOrigin: true

  posts:
    apiEndpoints:
      - posts
    policies:
      # Uncomment `key-auth:` when instructed to in the Getting Started guide.
      # - key-auth:
      - rate-limit:
          - action:
              max: 20
              windowMs: 120000
              rateLimitBy: '${req.ip}'

      - proxy:
          - action:
              serviceEndpoint: postService
              changeOrigin: true

  auth:
    apiEndpoints:
      - auth
    policies:
      # Uncomment `key-auth:` when instructed to in the Getting Started guide.
      # - key-auth:
      - log:
          - action:
              message: '${req.method} ${req.originalUrl}'
      - rate-limit:
          - action:
              max: 20
              windowMs: 120000
              rateLimitBy: '${req.ip}'

      - proxy:
          - action:
              serviceEndpoint: authService
              changeOrigin: true
